<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

    <style>
        #div1
        {
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 10px;
            position: static;
           
        }

        #div2
        {
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 10px;
            position: relative;
            top: 10px;
            left: 70px;
            right: 10px;
            bottom: 30px;
        }

        #div3
        {
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 10px;
            position: absolute;
            top: 70px;

        }

        #div4
        {
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 10px;
            

        }

        #div5
        {
            height: 100px;
            width: 100px;
            background-color: green;
            margin: 10px;
            
        }
    </style>

    
</head>
<body>
    <div id="div1">1 static</div>
    <div id="div2">2 relative</div>
    <div id="div3">3 absolute</div>
    <div id="div4">4 fixed</div>
    <div id="div5">5 sticky</div>
    <div id="div5">5 sticky</div>
    <div id="div5">5 sticky</div>
    <div id="div5">5 sticky</div>
    <div id="div5">5 sticky</div>
</body>
</html>
