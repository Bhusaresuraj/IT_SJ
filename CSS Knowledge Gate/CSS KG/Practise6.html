<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>

        * {
            margin: 0px;
            padding: 0px;
        }

        header
        {
            height: 70px;
            width: 100%;
            background-color: hsl(55, 100%, 50%);
        }

        h1
        {
            float: left;
            display: flex;
            text-align: center;
            margin-left: 20px;
            margin-top: 15px;
            font-size: 40px;

        }

        nav 
        {
            float: right;
            display: flex;
            justify-content: space-evenly;
            gap: 20px;
            margin-right: 70px;
            margin-top: 18px;
            font-size: 30px;
        }

        nav a
        {
            text-decoration: none;

        }

    </style>
</head>
<body>
    <header>

        <h1>
            Hello 
        </h1>

        <nav>
            <a href="">About</a>
            <a href="">Skills</a>
            <a href="">Projects</a>
            <a href="">Contact</a>
        </nav>

    </header>
</body>
</html>
