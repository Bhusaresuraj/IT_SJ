<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <link rel="icon" href="https://rukminim2.flixcart.com/fk-p-flap/92/36/image/31f7e3af490c225f.png?q=60" type="image/png">
</head>
<body>
    <h1 align="center"><mark>Login Page</mark></h1>
    <form action="" align="center">
        <label for="fname">Enter your name</label>
        <input type="text" placeholder="Enter your first name" id="fname"><br><br>
        <label for="femail">Enter your email id</label>
        <input type="email" placeholder="Enter your email id" id="femail"><br><br>
        <label for="fpassword">Enter your password</label>
        <input type="password" placeholder="Enter your password" id="fpassword"><br><br>
        <input type="submit">
        <input type="reset">
    </form>
</body>
</html>
